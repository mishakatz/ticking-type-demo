<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ticking Type</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Сцена: квадрат min(vw,vh) по центру. Пять слоёв друг на друга. -->
  <main class="scene" id="scene" aria-hidden="true">
    <!-- Два слоя циферблата для кроссфейда: новый проявляется поверх текущего
         синхронно с заливкой фона, без промежуточного «моргающего» кадра. -->
    <img class="layer dial" id="dial-a" alt="" decoding="async">
    <img class="layer dial" id="dial-b" alt="" decoding="async">

    <!-- Стрелки и колпачок: внешний .layer несёт неподвижную тень,
         внутренний .layer__rot вращается. Inline SVG вставляет clock.js. -->
    <div class="layer hand" data-hand="hour"><div class="layer__rot"></div></div>
    <div class="layer hand" data-hand="minute"><div class="layer__rot"></div></div>
    <div class="layer hand" data-hand="second"><div class="layer__rot"></div></div>
    <div class="layer cap"  data-hand="cap"><div class="layer__rot"></div></div>
  </main>

  <script src="./clock.js"></script>
</body>
</html>
